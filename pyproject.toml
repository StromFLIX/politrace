[project]
name = "politrace-pipeline"
version = "0.1.0"
description = "Evidence-first, Git-native manifesto and German law ingestion"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.11,<3",
  "httpx>=0.28,<1",
  "pymupdf4llm>=0.0.27,<1",
  "defusedxml>=0.7.1,<1",
  "snowballstemmer>=3,<4",
  "beautifulsoup4>=4.13,<5",
  "openpyxl>=3.1,<4",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[project.scripts]
politrace = "pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
