name: Propose criteria for an imported manifesto
on:
  workflow_dispatch:
    inputs:
      program_id:
        description: Existing live programme ID (merge its tree PR first)
        required: true
        type: string
      budget:
        description: OpenRouter USD limit (reported charges plus outstanding reservations)
        default: '5'
        type: string

permissions:
  contents: write
  pull-requests: write
concurrency:
  group: politrace-data-updates
  cancel-in-progress: false
jobs:
  propose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Preserve pending criterion corrections
        id: pending
        env:
          GH_TOKEN: ${{ secrets.DATA_PR_TOKEN || github.token }}
        run: |
          count=$(gh pr list --repo "$GITHUB_REPOSITORY" --head data/criteria --state open --json number --jq 'length')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -gt 0 ]; then echo 'An existing criteria PR awaits review. No model calls made.' >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        if: steps.pending.outputs.count == '0'
        with:
          enable-cache: true
          python-version: '3.13'
      - if: steps.pending.outputs.count == '0'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/llm
          key: llm-criteria-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            llm-criteria-
            llm-programs-
      - if: steps.pending.outputs.count == '0'
        run: uv sync --frozen
      - name: Evaluate every unprocessed leaf and validate its citations
        if: steps.pending.outputs.count == '0'
        run: uv run python scripts/workflow_entry.py criteria
        env:
          INPUT_PROGRAM_ID: ${{ inputs.program_id }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'anthropic/claude-sonnet-5.5' }}
          POLITRACE_MAX_USD: ${{ inputs.budget || '5' }}
          POLITRACE_MAX_CALLS: ${{ vars.POLITRACE_MAX_CALLS || '200' }}
      - name: Preserve completed calls if the run stops on budget
        if: always() && steps.pending.outputs.count == '0'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/llm
          key: llm-criteria-${{ github.run_id }}-${{ github.run_attempt }}
      - if: success() && steps.pending.outputs.count == '0'
        run: uv run pytest
      - if: success() && steps.pending.outputs.count == '0'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.DATA_PR_TOKEN || github.token }}
          branch: data/criteria
          base: main
          add-paths: data/live/**
          commit-message: 'data: propose source-backed acceptance criteria'
          title: 'data: acceptance criteria for an imported manifesto'
          body: |
            Every unprocessed leaf was evaluated with its parent sections. Exact quotes were checked.
            Empty extractions carry an abstention reason; existing criteria and review decisions are preserved.
            All new criteria remain proposed and unassessed. Review atomicity, measurability and source fidelity.
            No automatic fulfilment scores, votes or merges. Later runs preserve this pending review.
          delete-branch: true
