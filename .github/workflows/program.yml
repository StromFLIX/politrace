name: Propose a manifesto tree
on:
  workflow_dispatch:
    inputs:
      pdf:
        description: Public HTTPS URL of the programme PDF
        required: true
        type: string
      source_url:
        description: Canonical original source URL
        required: true
        type: string
      party:
        description: Party ID
        required: true
        type: choice
        options: [cdu-csu, spd, gruene, fdp, afd, linke, bsw, ssw]
      year:
        description: Election year (e.g. 2025)
        required: true
        type: string
      title:
        description: Programme title
        required: true
        type: string
      published:
        description: Publication date (YYYY-MM-DD)
        required: true
        type: string
      period_start:
        description: Comparison starts (YYYY-MM-DD, not before publication)
        required: true
        type: string
      period_end:
        description: Optional exclusive end of comparison window (YYYY-MM-DD)
        type: string
      program_id:
        description: Optional edition ID; defaults to party-year. Existing IDs are never overwritten.
        type: string
      license_note:
        description: Actual permission/licence for public full-text reuse, with source and restrictions
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
concurrency:
  group: politrace-data-updates
  cancel-in-progress: false
jobs:
  propose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Preserve pending manifesto corrections
        id: pending
        env:
          GH_TOKEN: ${{ secrets.DATA_PR_TOKEN || github.token }}
        run: |
          count=$(gh pr list --repo "$GITHUB_REPOSITORY" --head data/manifesto --state open --json number --jq 'length')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -gt 0 ]; then echo 'An existing manifesto PR awaits review. No model calls made.' >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        if: steps.pending.outputs.count == '0'
        with:
          enable-cache: true
          python-version: '3.13'
      - if: steps.pending.outputs.count == '0'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/llm
          key: llm-programs-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            llm-programs-
            llm-laws-
      - if: steps.pending.outputs.count == '0'
        run: uv sync --frozen
      - name: Extract PDF, preserve paragraphs and propose a section tree
        if: steps.pending.outputs.count == '0'
        run: uv run python scripts/workflow_entry.py program
        env:
          INPUT_PDF: ${{ inputs.pdf }}
          INPUT_SOURCE_URL: ${{ inputs.source_url }}
          INPUT_PARTY: ${{ inputs.party }}
          INPUT_YEAR: ${{ inputs.year }}
          INPUT_TITLE: ${{ inputs.title }}
          INPUT_PUBLISHED: ${{ inputs.published }}
          INPUT_PERIOD_START: ${{ inputs.period_start }}
          INPUT_PERIOD_END: ${{ inputs.period_end }}
          INPUT_PROGRAM_ID: ${{ inputs.program_id }}
          INPUT_LICENSE_NOTE: ${{ inputs.license_note }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openai/gpt-4.1-mini' }}
          OPENROUTER_REVIEW_MODEL: ${{ vars.OPENROUTER_REVIEW_MODEL || 'openai/gpt-4.1-mini' }}
          POLITRACE_MAX_USD: ${{ vars.POLITRACE_MAX_USD || '5' }}
          POLITRACE_MAX_CALLS: ${{ vars.POLITRACE_MAX_CALLS || '200' }}
      - name: Preserve completed calls if the run stops on budget
        if: always() && steps.pending.outputs.count == '0'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/llm
          key: llm-programs-${{ github.run_id }}-${{ github.run_attempt }}
      - if: success() && steps.pending.outputs.count == '0'
        run: uv run pytest
      - if: success() && steps.pending.outputs.count == '0'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.DATA_PR_TOKEN || github.token }}
          branch: data/manifesto
          base: main
          add-paths: data/live/**
          commit-message: 'data: propose manifesto transcription and tree'
          title: 'data: new manifesto transcription and proposed tree'
          body: |
            New source-backed programme data. All model outputs remain proposals.
            Review the original PDF against the Markdown, the section hierarchy, and every criterion's
            measurability and exact quote. Confirm the comparison window explicitly.
            No automatic fulfilment scores, votes or merges. Future runs preserve this pending review.
          delete-branch: true
