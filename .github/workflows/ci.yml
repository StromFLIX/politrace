name: Validate & test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      validated_revision:
        description: 'Production publisher only: SHA whose code was already tested (Git verifies data-only changes)'
        required: false
        type: string
        default: ''

permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      full_code: ${{ steps.checks.outputs.full_code }}
      container: ${{ steps.checks.outputs.container }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Scope needs commit/tree history, not every historic OCR/data blob.
          # Sparse checkout enables blob:none filtering in actions/checkout v4.
          fetch-depth: 0
          sparse-checkout: scripts/ci_scope.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Select checks conservatively from Git history
        id: checks
        env:
          VALIDATED_REVISION: ${{ github.event_name == 'workflow_dispatch' && github.actor == 'github-actions[bot]' && inputs.validated_revision || '' }}
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: python scripts/ci_scope.py

  python:
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          python-version: '3.13'
      - run: uv sync --frozen
      - run: uv run ruff check .
        if: needs.scope.outputs.full_code == 'true'
      - run: uv run politrace validate
      - name: Ensure published JSON Schemas are current
        run: |
          uv run politrace schemas
          git diff --exit-code -- data/schemas
      - run: uv run pytest
        if: needs.scope.outputs.full_code == 'true'

  frontend:
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=high
        if: needs.scope.outputs.full_code == 'true'
      - run: npm test
        if: needs.scope.outputs.full_code == 'true'
      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
      - run: npx playwright install --with-deps chromium
      - name: Full local desktop/mobile browser suite (two GitHub workers)
        run: npm run test:e2e
      - name: Export the tested production snapshot without rebuilding it
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python scripts/verify_deployment.py --export-snapshot deployment-snapshot
      - name: Retain exact snapshot for the independent deployment check
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-snapshot
          path: deployment-snapshot/
          retention-days: 1
      - name: Browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-local-results
          path: test-results/
          retention-days: 7

  container:
    needs: scope
    if: needs.scope.outputs.container == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.local.yml
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and smoke-test the production Compose stack
        run: |
          docker compose config --quiet
          docker compose up --build --wait --wait-timeout 180
          curl --fail http://127.0.0.1:8080/api/health.json
          curl --fail --output /tmp/politrace-laws.json http://127.0.0.1:8080/api/v1/live/laws.json
          node -e "JSON.parse(require('fs').readFileSync('/tmp/politrace-laws.json', 'utf8'))"
          status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/v1/live/missing.json)
          test "$status" = "404"
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down

  # Preserve the existing required "test" status while deployment reports separately.
  test:
    needs: [scope, python, frontend, container]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all applicable code/data/container checks
        env:
          SCOPE: ${{ needs.scope.result }}
          PYTHON: ${{ needs.python.result }}
          FRONTEND: ${{ needs.frontend.result }}
          CONTAINER: ${{ needs.container.result }}
          EXPECT_CONTAINER: ${{ needs.scope.outputs.container }}
        run: |
          test "$SCOPE" = success
          test "$PYTHON" = success
          test "$FRONTEND" = success
          if [ "$EXPECT_CONTAINER" = true ]; then
            test "$CONTAINER" = success
          else
            test "$CONTAINER" = skipped
          fi

  deployment:
    name: Verify production deployment
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: deployment-snapshot
          path: deployment-snapshot
      - name: Verify the exact tested snapshot after the GitHub App deployment
        timeout-minutes: 12
        run: python scripts/verify_deployment.py --dist deployment-snapshot --timeout 600
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Production homepage, API, reader and citation smoke tests
        env:
          POLITRACE_TEST_BASE_URL: https://politrace.stromflix.com
        run: npm run test:e2e -- --grep @smoke
      - name: Production browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-production-results
          path: test-results/
          retention-days: 7
