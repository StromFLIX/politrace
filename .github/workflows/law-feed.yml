name: Propose new laws & evidence
on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum new laws (1–2000; archive reports any remainder)
        default: '10'
        type: string
      since:
        description: Oldest publication date (YYYY-MM-DD); first sitting of the 21st Bundestag by default
        default: '2025-03-25'
        type: string
      budget:
        description: OpenRouter USD limit (reported charges plus outstanding reservations)
        default: '5'
        type: string
  # Recurrence moved to production.yml: one resumable queue for every programme.

permissions:
  contents: write
  pull-requests: write
concurrency:
  group: politrace-data-updates
  cancel-in-progress: false
jobs:
  propose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Preserve an already open data review (never overwrite its edits)
        id: pending
        env:
          GH_TOKEN: ${{ secrets.DATA_PR_TOKEN || github.token }}
        run: |
          count=$(gh pr list --repo "$GITHUB_REPOSITORY" --head data/law-feed --state open --json number --jq 'length')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -gt 0 ]; then echo 'An existing data PR awaits review. No sources or model calls made.' >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        if: steps.pending.outputs.count == '0'
        with:
          enable-cache: true
          python-version: '3.13'
      - name: Restore validated model responses
        if: steps.pending.outputs.count == '0'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/llm
          key: llm-laws-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            llm-laws-
            llm-programs-
      - if: steps.pending.outputs.count == '0'
        run: uv sync --frozen
      - name: Import → retrieve → judge → challenge → validate
        if: steps.pending.outputs.count == '0'
        run: uv run python scripts/workflow_entry.py laws
        env:
          INPUT_LIMIT: ${{ inputs.limit || '10' }}
          INPUT_SINCE: ${{ inputs.since || '2025-03-25' }}
          INPUT_ARCHIVE: 'true'
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'anthropic/claude-sonnet-5.5' }}
          OPENROUTER_REVIEW_MODEL: ${{ vars.OPENROUTER_REVIEW_MODEL || 'openai/gpt-5.6-sol' }}
          POLITRACE_MAX_USD: ${{ inputs.budget || '5' }}
          POLITRACE_MAX_CALLS: ${{ vars.POLITRACE_MAX_CALLS || '200' }}
      - name: Cache completed calls even after a budget stop
        if: always() && steps.pending.outputs.count == '0'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/llm
          key: llm-laws-${{ github.run_id }}-${{ github.run_attempt }}
      - if: success() && steps.pending.outputs.count == '0'
        run: uv run pytest
      - name: Open a PR only when canonical data changed
        if: success() && steps.pending.outputs.count == '0'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.DATA_PR_TOKEN || github.token }}
          branch: data/law-feed
          base: main
          add-paths: data/live/**
          commit-message: 'data: propose official laws and evidence links'
          title: 'data: new law publications and proposed evidence'
          body: |
            Automated proposals from the official Bundesgesetzblatt I/II archive or, when its public
            search rejects runner access, the dated checked inventory plus both official RSS feeds.
            Publication-date scope starts at 2025-03-25 by default, not the parliamentary vote date.
            Coverage records report the actual archive date and any limit-related remainder;
            RSS additions never establish complete archive coverage after the saved inventory date.
            - Exact source quotations and graph contracts validated in this run.
            - AI links remain `proposed`; no automatic fulfilment assessments or voting guesses.
            - Inspect source PDFs, legal context, comparison windows and the retrieval omissions.
            - Do not auto-merge. Citizen corrections on this open PR are preserved: later runs wait.
            - See the workflow summary for source counts, provider-reported costs and outstanding reservations.
          delete-branch: true
