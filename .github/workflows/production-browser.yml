name: Full production browser checks
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-browser
  cancel-in-progress: true
jobs:
  browsers:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      POLITRACE_TEST_BASE_URL: https://politrace.stromflix.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Exhaustive read-only desktop/mobile checks against HTTPS
        run: npm run test:e2e
      - name: Browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-full-production-results
          path: test-results/
          retention-days: 7
