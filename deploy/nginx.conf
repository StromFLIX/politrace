server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # The application emits external JS only; document text is always escaped.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Entirely public, read-only snapshot data. No credentialed API.
    add_header Access-Control-Allow-Origin "*" always;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json text/markdown image/svg+xml;

    location /api/ {
        types { application/json json; text/markdown md; }
        default_type application/json;
        try_files $uri =404;
        limit_except GET { deny all; }
    }
    location /_astro/ {
        expires 1y;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
    # Missing API records are real 404s, never a SPA index with status 200.
    error_page 404 /404.html;
    location = /404.html { internal; }
}
